---
- name: Install K3s agent
  shell: |
    curl -sfL {{ k3s_install_script }} | \
    K3S_URL={{ k3s_server_url }} \
    K3S_TOKEN={{ hostvars['k3s-server']['cluster_token'] }} \
    INSTALL_K3S_VERSION={{ k3s_version }} sh -
  args:
    creates: /usr/local/bin/k3s-agent
  when: "'k3s_workers' in group_names"